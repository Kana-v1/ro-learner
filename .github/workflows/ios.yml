# Builds an unsigned .ipa on a GitHub macOS runner. SideStore re-signs it with
# a free Apple ID on the phone, so no certificates or secrets live here.
name: iOS build

on:
  push:
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: app
        run: |
          xcodebuild -project RoLearner.xcodeproj -scheme RoLearner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::errors"; grep -E "error:" build.log | sort -u | head -60; echo "::endgroup::"
              tail -40 build.log
              exit 1
            }
          echo "warnings: $(grep -c 'warning:' build.log || true)"

      - name: Package .ipa
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RoLearner.app Payload/
          zip -qry RoLearner.ipa Payload
          ls -la RoLearner.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RoLearner-ipa
          path: app/RoLearner.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: app/build.log
          if-no-files-found: ignore
          retention-days: 7
